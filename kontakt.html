
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IT-Lightning - IT Support & Web Solutions</title>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="kontakt.css">
        <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    </head>
    <body class="site-body">
        <!-- Navigation -->
        <nav class="nav-bar">
            <div class="nav-container">
                <div class="nav-logo"><a href="index.html"><img src="logo_large.png" alt="IT-Lightning"></a></div>
                <div class="nav-desktop">
                    <a href="index.html#home" class="nav-item">Home</a>
                    <a href="webdev.html" class="nav-item">Webseiten</a>
                    <a href="about.html" class="nav-item">Über mich</a>
                    <a href="kontakt.html" class="nav-item">Kontakt</a>
                </div>
                <button id="hamburger-btn" class="hamburger-btn">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
            </div>
            <div id="mobile-menu" class="mobile-menu hidden">
                <a href="index.html#home" class="nav-item-mobile">Home</a>
                <a href="webdev.html" class="nav-item-mobile">Webseiten</a>
                <a href="about.html" class="nav-item-mobile">Über mich</a>
                <a href="kontakt.html" class="nav-item-mobile">Kontakt</a>
            </div>
        </nav>

        <section class="contact-page-section">
            <div class="contact-form-container">
                <h1>Kontaktiere uns</h1>
                <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="danke.html">
                <!-- Required hidden input for Netlify bot protection -->
                <input type="hidden" name="form-name" value="contact" />
                <p hidden>
                    <label>Don't fill this out if you're human: <input name="bot-field" /></label>
                </p>

                <!-- Your form fields -->
                <input type="text" id="fname" name="fname" placeholder="Vorname" required class="contact-input">
                <input type="text" id="lname" name="lname" placeholder="Nachname" required class="contact-input">
                <input type="email" id="email" name="email" placeholder="Email Adresse" required class="contact-input">
                <input type="tel" id="number" name="number" placeholder="Telefonnummer" required class="contact-input">
                <textarea id="message" name="message" rows="5" placeholder="Deine Nachricht" required class="contact-textarea"></textarea>

                <!-- reCAPTCHA (optional) -->
                <div data-netlify-recaptcha="true"></div>

                <input type="submit" value="Absenden" class="send-btn">
                </form>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 IT-Lightning. All rights reserved.</p>
            <a href="agb.html" id="agb-link">AGB</a>
        </footer>

        <script src="script.js"></script>
        <script src="kontakt.js"></script>
    </body>
</html>
